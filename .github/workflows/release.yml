name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libxdo-dev

      - name: Install frontend dependencies
        run: npm install

      - name: Write API key to .env
        shell: bash
        run: echo "VRSRC_API_KEY=${{ secrets.VRSRC_API_KEY }}" > .env

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Aether ${{ github.ref_name }}"
          releaseBody: |
            ## What's new
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for details.

            ## Downloads
            | Platform | File |
            |----------|------|
            | Windows | `SideQuest-Reloaded_x.x.x_x64-setup.exe` |
            | macOS (Apple Silicon) | `SideQuest-Reloaded_x.x.x_aarch64.dmg` |
            | macOS (Intel) | `SideQuest-Reloaded_x.x.x_x64.dmg` |
            | Linux | `SideQuest-Reloaded_x.x.x_amd64.AppImage` or `.deb` |

            ## Requirements
            - Meta Quest headset with Developer Mode enabled
            - ADB installed (`sudo apt install adb` on Linux, included on Windows/macOS via platform-tools)
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
