<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%"   stop-color="#1e1b2e"/>
      <stop offset="100%" stop-color="#0d0b14"/>
    </radialGradient>

    <!-- Primary glow -->
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#8b6ff0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b6ff0" stop-opacity="0"/>
    </radialGradient>

    <!-- Ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#a78bfa"/>
      <stop offset="50%"  stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>

    <!-- Inner ring gradient -->
    <linearGradient id="innerRingGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#c4b5fd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Text gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle outer glow for ring -->
    <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip to rounded square -->
    <clipPath id="roundedClip">
      <rect width="1024" height="1024" rx="224" ry="224"/>
    </clipPath>
  </defs>

  <!-- Rounded square background -->
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>

  <g clip-path="url(#roundedClip)">
    <!-- Ambient glow center -->
    <circle cx="512" cy="490" r="420" fill="url(#glowCenter)"/>

    <!-- Outer decorative ring (large, faint) -->
    <circle cx="512" cy="490" r="340" fill="none"
            stroke="url(#innerRingGrad)" stroke-width="1.5" opacity="0.4"/>

    <!-- Mid ring -->
    <circle cx="512" cy="490" r="290" fill="none"
            stroke="#7c3aed" stroke-width="1" opacity="0.25"/>

    <!-- Main glowing ring -->
    <circle cx="512" cy="490" r="234" fill="none"
            stroke="url(#ringGrad)" stroke-width="14"
            opacity="0.95" filter="url(#ringGlow)"/>

    <!-- Ring arc highlight (top-left) -->
    <path d="M 325 310 A 234 234 0 0 1 700 310"
          fill="none" stroke="#c4b5fd" stroke-width="14"
          stroke-linecap="round" opacity="0.5"/>

    <!-- Inner circle (faint) -->
    <circle cx="512" cy="490" r="180" fill="none"
            stroke="#a78bfa" stroke-width="1.5" opacity="0.15"/>

    <!-- Dot accents on ring -->
    <circle cx="512" cy="256" r="9"  fill="#c4b5fd" opacity="0.9"/>
    <circle cx="512" cy="724" r="6"  fill="#7c3aed" opacity="0.6"/>
    <circle cx="278" cy="490" r="6"  fill="#7c3aed" opacity="0.6"/>
    <circle cx="746" cy="490" r="9"  fill="#a78bfa" opacity="0.8"/>

    <!-- Æ ligature -->
    <text
      x="512" y="555"
      font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
      font-size="260"
      font-weight="800"
      text-anchor="middle"
      letter-spacing="-8"
      fill="url(#textGrad)"
      filter="url(#glow)"
    >Æ</text>

    <!-- Subtle bottom vignette -->
    <rect x="0" y="700" width="1024" height="324" rx="0"
          fill="url(#bg)" opacity="0.4"/>
  </g>

  <!-- Rounded border stroke -->
  <rect width="1024" height="1024" rx="224" ry="224"
        fill="none" stroke="#a78bfa" stroke-width="3" opacity="0.15"/>
</svg>
